services:
    sombra-lab:
        build: .

        container_name: sombra-lab

        restart: unless-stopped

        ports:
            - "192.168.50.10:3000:3000"

        environment:
            NODE_ENV: production
            PORT: 3000
            HOST: 0.0.0.0
            PORTAL_DB_PATH: /app/data/portal.sqlite
            CTF_DB_PATH: /app/data/ctf.sqlite

        volumes:
            - sombra-data:/app/data

        read_only: true

        tmpfs:
            - /tmp:size=16m,noexec,nosuid

        cap_drop:
            - ALL

        security_opt:
            - no-new-privileges:true

        pids_limit: 100

        mem_limit: 512m

        networks:
            - lab-network

volumes:
    sombra-data:

networks:
    lab-network:
        driver: bridge
        internal: true
